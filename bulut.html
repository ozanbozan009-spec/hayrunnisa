<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selin | Blue Sky</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Daha derin ve yumuşak geçişli bir gökyüzü */
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Arka Plan Yıldızları */
        .universe-bg { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            z-index: 0; 
        }
        
        .star { 
            position: absolute; 
            background: white; 
            border-radius: 50%; 
            opacity: 0.5; 
            animation: twinkle var(--duration) infinite ease-in-out; 
        }

        /* Ana Kart Tasarımı */
        .main-card {
            position: relative;
            z-index: 10;
            /* Mobilde ekranın %85'i, Masaüstünde max 450px */
            width: min(85vw, 450px);
            aspect-ratio: 1 / 1;
            background-image: url('OIG1.png');
            background-size: cover;
            background-position: center;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(79, 172, 254, 0.2);
            animation: float 6s ease-in-out infinite;
            display: flex;
            justify-content: center;
        }

        /* Alt kısımdaki kalp alanı */
        .heart-container {
            position: absolute;
            bottom: -35px; /* Kartın biraz daha dışına taşırarak derinlik kattık */
            cursor: pointer;
            z-index: 20;
        }

        .heart-icon {
            color: #ffffff;
            font-size: clamp(3.5rem, 8vw, 4.5rem);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
            animation: pulse 1.5s infinite;
            transition: transform 0.2s;
        }

        .heart-container:active .heart-icon {
            transform: scale(0.85);
        }

        /* Animasyonlar */
        @keyframes float { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-20px); } 
        }
        
        @keyframes twinkle { 
            0%, 100% { opacity: 0.3; transform: scale(1); } 
            50% { opacity: 1; transform: scale(1.2); } 
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #fff); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px #fff); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #fff); }
        }

        /* Tablet/Masaüstü için ufak dokunuş */
        @media (min-width: 1024px) {
            .main-card {
                width: 500px; /* Geniş ekranlarda biraz daha görkemli dursun */
            }
        }
    </style>
</head>
<body>

    <audio id="selinMusic" loop>
        <source src="selin.mp3" type="audio/mpeg">
    </audio>

    <div class="universe-bg" id="stars"></div>

    <div class="main-card">
        <div class="heart-container" id="heartBtn">
            <i class="fa-solid fa-heart heart-icon"></i>
        </div>
    </div>

    <script>
        // Yıldız Oluşturucu
        const starContainer = document.getElementById('stars');
        const count = window.innerWidth < 600 ? 60 : 150;

        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            starContainer.appendChild(star);
        }

        // Müzik Kontrolü
        const music = document.getElementById('selinMusic');
        const heartBtn = document.getElementById('heartBtn');

        heartBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play().catch(e => console.log("Başlatılamadı:", e));
            } else {
                music.pause();
            }
        });
    </script>
</body>
</html>
