<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELİN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; 
            height: 100vh;
            height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ANİMASYONLAR --- */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.5s infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Geliştirilmiş Süzülerek Düşüş */
        @keyframes fall { 
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); } 
        }

        /* Premium Salınım (Zikzak yerine yumuşak drift) */
        @keyframes sway { 
            0%, 100% { transform: translateX(-15px) rotate(-10deg); } 
            50% { transform: translateX(15px) rotate(10deg); } 
        }

        /* --- ARKA PLAN --- */
        #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 10000;
            transition: opacity 1.5s ease;
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 120%);
            z-index: 2; pointer-events: none;
        }

        /* --- GİRİŞ EKRANI (ŞİFRE: selinim) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease; padding: 20px; 
        }
        .login-card { 
            position: relative; text-align: center; width: 100%; max-width: 400px; 
            padding: 3rem 2rem; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0, 0.5);
            display: flex; flex-direction: column; align-items: center;
        }
        .scifi-loader { position: relative; width: 80px; height: 80px; margin-bottom: 25px; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .ring:nth-child(1) { top: 0; left: 0; width: 100%; height: 100%; border-top: 2px solid #0ff; animation: spin 2s linear infinite; }
        .ring:nth-child(2) { top: 15px; left: 15px; width: 50px; height: 50px; border-bottom: 2px solid #c084fc; animation: spin 3s linear infinite reverse; }
        .ring:nth-child(3) { top: 35px; left: 35px; width: 10px; height: 10px; background: #fff; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        #passwordInput {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; text-align: center; font-size: 1rem; 
            padding: 15px; width: 100%; outline: none; letter-spacing: 3px; margin-bottom: 20px;
        }
        .login-card button {
            width: auto; min-width: 200px; padding: 15px 30px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 12px;
            color: #0ff; font-weight: 600; letter-spacing: 4px; cursor: pointer;
            transition: all 0.4s ease; text-transform: uppercase;
        }

        /* --- ANA PANEL --- */
        .glass-card {
            position: relative; z-index: 10; background: rgba(20, 20, 30, 0.4); 
            backdrop-filter: blur(15px); padding: 4rem 3rem; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; 
            max-width: 850px; width: 90%; opacity: 0; transform: scale(0.9);
            transition: all 2s ease; display: none; 
        }
        .glass-card.active { animation: float 10s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        
        .timer-wrapper { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; flex-wrap: wrap; }
        .time-val { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 5vw, 3.2rem); text-shadow: 0 0 20px rgba(100, 150, 255, 0.6); }

        /* --- PEMBE EVREN --- */
        #pink-universe {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #ffe4e1 0%, #ffb6c1 50%, #ff69b4 100%);
            z-index: 20; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; animation: fadeIn 2s ease;
        }
        .special-trigger-btn {
            background: linear-gradient(45deg, rgba(255, 105, 180, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.3); padding: 12px 28px; border-radius: 30px;
            color: #fff; cursor: pointer; transition: all 0.5s ease; display: inline-flex;
            align-items: center; gap: 10px; text-transform: uppercase; margin-top: 20px;
        }
        .special-trigger-btn:hover { background: #fff; color: #ff69b4; transform: scale(1.05); }

        /* --- PREMİNYUM AKIŞ --- */
        .falling-item {
            position: fixed; top: -10vh; pointer-events: none; z-index: 30;
            animation: fall linear forwards;
        }
        .inner-sway { 
            animation: sway ease-in-out infinite; 
            display: inline-block;
        }
        
        .snow-flake {
            position: fixed; top: -10vh; pointer-events: none; z-index: 22;
            background: white; border-radius: 50%; opacity: 0.6; 
            animation: fall linear forwards;
        }
        /* --- MOBİL VE TABLET UYUMLULUK AYARLARI --- */
@media (max-width: 768px) {
    /* Tablet ve Telefonlar için Genel Alan */
    .glass-card {
        padding: 2.5rem 1.5rem; /* Kenar boşluklarını daralt */
        width: 92%;
        max-width: none;
    }

    .timer-wrapper {
        gap: 15px; /* Geri sayım kutularını birbirine yaklaştır */
        margin-bottom: 30px;
    }

    .time-val {
        font-size: 2.2rem; /* Rakamları biraz küçült */
    }

    .time-unit span[style*="font-size:0.6rem"] {
        font-size: 0.5rem !important; /* GÜN, SAAT gibi yazıları küçült */
    }

    /* Giriş Kartı */
    .login-card {
        padding: 2rem 1.5rem;
        width: 90%;
    }

    #passwordInput {
        font-size: 0.9rem;
        padding: 12px;
        letter-spacing: 2px;
    }

    .login-card button {
        width: 100%; /* Mobilde butonu tam genişlik yap */
        min-width: unset;
        font-size: 0.8rem;
    }
}

@media (max-width: 480px) {
    /* Çok Küçük Telefonlar İçin */
    .timer-wrapper {
        gap: 10px;
    }

    .time-val {
        font-size: 1.8rem;
    }

    h1 {
        font-size: 1.5rem !important;
    }

    #pink-universe p {
        letter-spacing: 3px !important; /* Çok uzun harf arası mobilde kelimeyi böler */
        font-size: 0.7rem !important;
    }

    .special-trigger-btn {
        padding: 10px 20px;
        font-size: 0.7rem;
    }
}

/* Cihaz yan çevrildiğinde (Landscape) taşmayı önlemek için */
@media (max-height: 500px) and (orientation: landscape) {
    .glass-card {
        padding: 1rem;
        transform: scale(0.85);
    }
    .scifi-loader {
        display: none; /* Yan ekranda yer açmak için logoyu gizle */
    }
}
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div id="flash-overlay"></div>
    <div class="vignette"></div>

    <audio id="finalMusic" src="yıldız.mp3" loop preload="auto"></audio>
    <audio id="bizimMusic" src="bizim.mp3" loop preload="auto"></audio>

    <div id="login-screen">
        <div class="login-card">
            <div class="scifi-loader"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
            <h2 style="font-family:'Cinzel'; letter-spacing:4px;">BAĞLANTI</h2>
            <p style="font-size:0.7rem; color:rgba(255,255,255,0.5); margin-bottom:25px; letter-spacing:2px;">GÜVENLİK PROTOKOLÜ</p>
            <input type="password" id="passwordInput" placeholder="PAROLA" autocomplete="off">
            <button onclick="attemptLogin()">Sisteme Gir</button>
            <p id="login-error" style="color:#ff4d4d; font-size:0.75rem; margin-top:20px; opacity:0; transition:0.3s;">ERİŞİM REDDEDİLDİ</p>
        </div>
    </div>

    <div class="glass-card">
        <h1 style="font-family:'Cinzel';">SELİN</h1>
        <p style="margin-bottom:20px; color:rgba(200, 220, 255, 0.7); font-size: 0.9rem;">Bu bir geri sayım değil… Bu, ihtimallerin sessiz bekleyişi.</p>

        <div class="timer-wrapper">
            <div class="time-unit"><span id="days" class="time-val">00</span><span style="font-size:0.6rem; display:block;">GÜN</span></div>
            <div class="time-unit"><span id="hours" class="time-val">00</span><span style="font-size:0.6rem; display:block;">SAAT</span></div>
            <div class="time-unit"><span id="minutes" class="time-val">00</span><span style="font-size:0.6rem; display:block;">DAK</span></div>
            <div class="time-unit"><span id="seconds" class="time-val">00</span><span style="font-size:0.6rem; display:block;">SAN</span></div>
        </div>

        <div style="background:rgba(0,0,0,0.2); padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,0.05);">
    <span style="display:block; font-size:1.2rem; margin-bottom:10px; opacity:0.5;">🔒</span>
    <div id="secret-message-box" style="filter:blur(5px); font-family:'Cinzel'; color:rgba(255,255,255,0.4); font-size:0.8rem; margin-bottom: 15px;">▓▒░ ΛCCΞSS DΞNIΞD ░▒▓</div>
    
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="special-trigger-btn" onclick="startBizimExperience()">
            <span>💖</span> BİZİM DÜNYAMIZ <span>✨</span>
        </button>
        
        <button class="special-trigger-btn" onclick="window.location.href='bulut.html'">
            <span>☁️</span> GÖKYÜZÜNDE BEŞ YIL <span>⭐</span>
        </button>
    </div>
</div>

    <div id="pink-universe">
        <h2 style="font-family:'Cinzel'; color:#fff; font-size:clamp(1.8rem, 6vw, 3.5rem); text-shadow:0 0 25px rgba(255,255,255,0.7); margin-bottom:15px;">SENİ SEVİYORUM</h2>
        <p style="letter-spacing:6px; font-weight:300; opacity:0.8; font-size:0.8rem;">SONSUZ BİR İHTİMALİN İÇİNDE...</p>
    </div>

    <script>
        // --- STARFIELD ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], warpSpeed = 0, baseSpeed = 2, isWarping = false;

        function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Star {
            constructor() { this.reset(); }
            reset() { this.x = (Math.random() - 0.5) * width * 2; this.y = (Math.random() - 0.5) * height * 2; this.z = Math.random() * width; }
            update() {
                this.z -= (isWarping ? warpSpeed : baseSpeed);
                if (this.z < 1) { this.reset(); this.z = width; }
            }
            draw() {
                let sx = (width/2) + (this.x / this.z) * (width/2);
                let sy = (height/2) + (this.y / this.z) * (height/2);
                const depth = (1 - this.z / width);
                ctx.fillStyle = `rgba(255, 255, 255, ${depth})`;
                ctx.beginPath(); ctx.arc(sx, sy, depth * (isWarping ? 3 : 1.5), 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 600; i++) stars.push(new Star());

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; ctx.fillRect(0, 0, width, height);
            if (isWarping && warpSpeed < 100) warpSpeed += 0.5;
            else if (!isWarping && warpSpeed > baseSpeed) warpSpeed *= 0.95;
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- WARP SESİ ---
        function playWarpSound(durationSec) {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = actx.createBuffer(1, actx.sampleRate * durationSec, actx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < buffer.length; i++) {
                    let white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5;
                }
                const noise = actx.createBufferSource();
                noise.buffer = buffer;
                const filter = actx.createBiquadFilter();
                filter.type = 'lowpass';
                const gain = actx.createGain();
                gain.gain.setValueAtTime(0, actx.currentTime);
                gain.gain.linearRampToValueAtTime(0.8, actx.currentTime + 2);
                gain.gain.linearRampToValueAtTime(0, actx.currentTime + durationSec);
                noise.connect(filter); filter.connect(gain); gain.connect(actx.destination);
                noise.start();
            } catch (e) { console.error("Ses motoru hatası:", e); }
        }

        // --- GİRİŞ SİSTEMİ ---
        function attemptLogin() {
            const pass = document.getElementById("passwordInput").value.toLowerCase().trim();
            if (pass === "selinim") {
                document.getElementById("login-screen").style.opacity = "0";
                playWarpSound(12); 
                isWarping = true; document.body.classList.add("shaking");
                setTimeout(() => { document.getElementById("flash-overlay").style.opacity = "1"; }, 11500);
                setTimeout(() => {
                    isWarping = false; document.body.classList.remove("shaking");
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("finalMusic").play();
                    const mc = document.querySelector(".glass-card");
                    mc.style.display = "block"; document.getElementById("flash-overlay").style.opacity = "0";
                    setTimeout(() => { mc.style.opacity = "1"; mc.style.transform = "scale(1)"; mc.classList.add("active"); }, 500);
                }, 13000);
            } else {
                document.getElementById("login-error").style.opacity = "1";
                setTimeout(() => document.getElementById("login-error").style.opacity = "0", 2000);
            }
        }

        // --- PREMİNYUM PEMBE EVREN GEÇİŞİ ---
        let experienceActive = false;
        function startBizimExperience() {
            if(experienceActive) return;
            experienceActive = true;
            document.querySelector(".glass-card").style.opacity = "0";
            setTimeout(() => {
                document.querySelector(".glass-card").style.display = "none";
                document.getElementById("canvas-bg").style.display = "none";
                document.getElementById("pink-universe").style.display = "flex";
            }, 1000);

            document.getElementById("finalMusic").pause();
            const bm = document.getElementById("bizimMusic");
            bm.volume = 0.5; bm.play();

            setInterval(createYumosHeart, 500); 
            setInterval(createSnowFlake, 300);
        }

        function createYumosHeart() {
            const symbols = ['❤️', '💖', '🎀', '💝', '🤍'];
            const container = document.createElement('div');
            container.className = 'falling-item';
            const inner = document.createElement('span');
            inner.className = 'inner-sway';
            inner.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            container.appendChild(inner);
            
            const size = Math.random() * 8 + 12; 
            const duration = Math.random() * 5 + 8; // Daha yavaş süzülme
            const leftPos = Math.random() * 100;

            container.style.left = leftPos + 'vw';
            container.style.fontSize = size + 'px';
            container.style.opacity = Math.random() * 0.5 + 0.4;
            container.style.filter = `blur(${Math.random() * 1}px)`;
            container.style.animationDuration = duration + 's';
            
        
            inner.style.animationDuration = (Math.random() * 3 + 3) + 's';
            inner.style.animationDelay = (Math.random() * 2) + 's';

            document.body.appendChild(container);
            setTimeout(() => container.remove(), duration * 1000);
        }

        function createSnowFlake() {
            const flake = document.createElement('div');
            flake.className = 'snow-flake';
            const size = Math.random() * 4 + 2 + 'px';
            const duration = Math.random() * 6 + 10; // Karlar daha da yavaş

            flake.style.width = size; flake.style.height = size;
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.opacity = Math.random() * 0.6 + 0.2;
            flake.style.animationDuration = duration + 's';
            flake.style.filter = "blur(1px)";

            document.body.appendChild(flake);
            setTimeout(() => flake.remove(), duration * 1000);
        }

        
        const target = new Date("2031-01-01T00:00:00").getTime();
        setInterval(() => {
            const dist = target - new Date().getTime();
            if (dist < 0) return;
            document.getElementById('days').innerText = String(Math.floor(dist / 86400000)).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((dist % 86400000) / 3600000)).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
            document.getElementById('seconds').innerText = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
        }, 1000);

        document.getElementById("passwordInput").addEventListener("keypress", (e) => { if(e.key === "Enter") attemptLogin(); });
    </script>
</body>
</html>
