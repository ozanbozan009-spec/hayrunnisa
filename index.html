<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YÖRÜNGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMEL AYARLAR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Scroll engelleme */
            height: 100vh;
            height: 100dvh; /* Mobil tarayıcı çubuğu sorunu için */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Warp sırasında ekranı titretmek için */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s infinite;
        }

        /* --- CANVAS (YILDIZLAR) --- */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- BEYAZ FLAŞ EFEKTİ --- */
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0; pointer-events: none; z-index: 10000;
            transition: opacity 1.5s ease;
        }

        /* --- VIGNETTE --- */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 120%);
            z-index: 2; pointer-events: none;
        }

        /* --- PREMIUM LOGIN EKRANI --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
            padding: 20px; /* Mobilde kenar boşluğu */
        }

        .login-card { 
            position: relative;
            text-align: center; 
            width: 100%; 
            max-width: 400px; /* Maksimum genişlik sınırı */
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 50px rgba(0,0,0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.5s ease;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        /* Sci-Fi Loader */
        .scifi-loader {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 25px;
        }
        
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        
        .ring:nth-child(1) {
            top: 0; left: 0; width: 100%; height: 100%;
            border-top: 2px solid #0ff;
            animation: spin 2s linear infinite;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .ring:nth-child(2) {
            top: 15px; left: 15px; width: 50px; height: 50px;
            border-bottom: 2px solid #c084fc; 
            animation: spin 3s linear infinite reverse;
        }
        
        .ring:nth-child(3) {
            top: 35px; left: 35px; width: 10px; height: 10px;
            background: #fff;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px #fff;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        .login-card h2 {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            margin-bottom: 5px;
            font-size: clamp(1.2rem, 5vw, 1.6rem); /* Responsive font */
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        
        .login-sub { 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.6); 
            margin-bottom: 30px; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        /* Input Alanı */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        #passwordInput {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff; 
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; 
            padding: 15px; 
            width: 100%;
            outline: none; 
            letter-spacing: 3px;
            transition: all 0.3s;
        }

        #passwordInput:focus { 
            border-color: #0ff; 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); 
        }

        /* Buton */
        .login-card button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            color: #0ff;
            font-family: 'Montserrat', sans-serif; 
            font-weight: 600;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .login-card button:hover { 
            background: #0ff; 
            color: #000; 
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            letter-spacing: 6px; 
        }

        #login-error {
            color: #ff4d4d; 
            font-size: 0.75rem; 
            letter-spacing: 2px;
            margin-top: 25px; 
            opacity: 0; 
            transition: opacity 0.3s;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        /* --- ANA KART (YÖRÜNGE) --- */
        .glass-card {
            position: relative; z-index: 10;
            background: rgba(20, 20, 30, 0.4); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 4rem 3rem; 
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 80px rgba(0,0,0,0.8); 
            text-align: center; 
            max-width: 850px; 
            width: 90%; /* Mobilde kenarlardan taşmayı önler */
            
            opacity: 0; transform: scale(0.9);
            transition: all 2s ease;
            display: none; 
        }
        
        .glass-card.active {
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-family: 'Cinzel', serif; 
            font-size: clamp(2rem, 6vw, 3.8rem); /* Responsive Font Boyutu */
            letter-spacing: clamp(4px, 1vw, 12px); /* Responsive Harf Aralığı */
            margin-bottom: 10px; color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            line-height: 1.2;
        }

        .subtitle {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: rgba(200, 220, 255, 0.8);
            letter-spacing: 2px; 
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: inline-block; padding-bottom: 15px;
            width: 90%;
        }

        .timer-wrapper { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            margin-bottom: 40px; 
            flex-wrap: wrap; /* Küçük ekranlarda sığmazsa alt satıra geçmesin, boyutu küçülsün diye aşağıda ayar var ama wrap güvenliktir */
        }
        
        .time-unit { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 60px; 
        }
        
        .time-val { 
            font-family: 'Cinzel', serif; 
            font-size: clamp(1.8rem, 5vw, 3.2rem); 
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.6); 
        }
        
        .time-label { 
            font-size: 0.6rem; 
            color: #aab; 
            letter-spacing: 2px; 
            margin-top: 5px; 
        }

        .capsule-container {
            margin-top: 10px; padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }

        .lock-icon { font-size: 1.5rem; margin-bottom: 10px; opacity: 0.8; display: block; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .message-blur { 
            font-family: 'Cinzel', serif; 
            font-size: clamp(0.8rem, 3vw, 1rem); 
            color: rgba(255,255,255,0.5); 
            filter: blur(5px); 
            transition: all 1.5s ease; 
            user-select: none;
            word-wrap: break-word; /* Mobilde uzun yazı taşmasın */
        }
        .status-text { font-size: 0.6rem; margin-top: 15px; color: #667; letter-spacing: 2px; }

        /* --- MOBİL İÇİN ÖZEL AYARLAR --- */
        @media (max-width: 768px) {
            .glass-card { 
                padding: 2rem 1.5rem; 
                width: 95%;
            }
            .timer-wrapper { 
                gap: 15px; 
            }
            .login-card {
                padding: 2rem 1.5rem;
            }
            .scifi-loader {
                width: 60px; height: 60px;
            }
            .ring:nth-child(2) {
                width: 35px; height: 35px; top: 12px; left: 12px;
            }
            .ring:nth-child(3) {
                top: 25px; left: 25px;
            }
        }

        @media (max-width: 480px) {
            h1 { letter-spacing: 2px; }
            .timer-wrapper { gap: 10px; }
            .time-unit { min-width: auto; }
            .login-card h2 { letter-spacing: 2px; }
            #passwordInput { letter-spacing: 1px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div id="flash-overlay"></div>
    <div class="vignette"></div>

    <audio id="finalMusic" src="yıldız.mp3" loop preload="auto"></audio>

    <div id="login-screen">
        <div class="login-card" id="loginCardUI">
            <div class="scifi-loader">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>

            <h2>BAĞLANTI</h2>
            <p class="login-sub">Güvenlik Protokolü</p>
            
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="PAROLA" autocomplete="off">
            </div>
            
            <button onclick="attemptLogin()">Sisteme Gir</button>
            
            <p id="login-error">ERİŞİM REDDEDİLDİ</p>
        </div>
    </div>

    <div class="glass-card">
        <h1>YÖRÜNGE</h1>
        
        <p class="subtitle">
            Bu bir geri sayım değil…<br>
            <span class="hope-text">Bu, ihtimallerin sessiz bekleyişi.</span>
        </p>

        <div class="timer-wrapper">
            <div class="time-unit">
                <span id="days" class="time-val">00</span>
                <span class="time-label">GÜN</span>
            </div>
            <div class="time-unit">
                <span id="hours" class="time-val">00</span>
                <span class="time-label">SAAT</span>
            </div>
            <div class="time-unit">
                <span id="minutes" class="time-val">00</span>
                <span class="time-label">DAK</span>
            </div>
            <div class="time-unit">
                <span id="seconds" class="time-val">00</span>
                <span class="time-label">SAN</span>
            </div>
        </div>

        <div class="capsule-container">
            <span class="lock-icon">🔒</span>
            <div class="message-blur" id="secret-message-box">
                ▓▒░ ΛCCΞSS DΞNIΞD ░▒▓
            </div>
            <p class="status-text">Kapsül Kapalı</p>
        </div>
    </div>

    <script>
        /**
         * 1. BÖLÜM: 3D WARP DRIVE SİMÜLASYONU + RANDOM METEORLAR
         */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let meteors = []; 
        let warpSpeed = 0; 
        let baseSpeed = 2; 
        let targetSpeed = baseSpeed; 
        let isWarping = false; 
        let canSpawnMeteors = false; 
        let nextMeteorTime = 0; 

        const numStars = 800;
        let cx, cy;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }
        // Mobilde adres çubuğu değişince resize tetiklenebilir, bu yüzden debounce kullanmak sağlıklı olur ama
        // bu basitlikte direkt çağırmak da iş görür.
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- YILDIZ SINIFI ---
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2; 
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width; 
                this.pz = this.z; 
            }

            update() {
                this.z -= (warpSpeed > 0 ? warpSpeed : baseSpeed);
                if (this.z < 1) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }

            draw() {
                let sx = cx + (this.x / this.z) * cx;
                let sy = cy + (this.y / this.z) * cy;
                let px = cx + (this.x / this.pz) * cx;
                let py = cy + (this.y / this.pz) * cy;

                this.pz = this.z; 

                if (sx > 0 && sx < width && sy > 0 && sy < height) {
                    const depth = (1 - this.z / width); 
                    const size = depth * (isWarping ? 4 : 2); 
                    const alpha = depth; 

                    ctx.beginPath();
                    
                    if (isWarping && warpSpeed > 10) {
                        ctx.strokeStyle = "rgba(200, 240, 255, " + alpha + ")";
                        ctx.lineWidth = size;
                        ctx.moveTo(px, py);
                        ctx.lineTo(sx, sy);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = "rgba(255, 255, 255, " + alpha + ")";
                        ctx.arc(sx, sy, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        // --- METEOR SINIFI ---
        class Meteor {
            constructor() {
                this.active = false;
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.alpha = 0;
                this.length = 0;
            }

            spawn() {
                this.active = true;
                this.alpha = 1;
                this.length = Math.random() * 200 + 150; 
                
                const side = Math.floor(Math.random() * 4);

                if(side === 0) { 
                    this.x = Math.random() * width;
                    this.y = -100;
                    this.vx = (Math.random() - 0.5) * 15;
                    this.vy = Math.random() * 10 + 10;
                } 
                else if(side === 1) { 
                    this.x = width + 100;
                    this.y = Math.random() * height;
                    this.vx = -(Math.random() * 10 + 15);
                    this.vy = (Math.random() - 0.5) * 15;
                }
                else if(side === 2) { 
                    this.x = Math.random() * width;
                    this.y = height + 100;
                    this.vx = (Math.random() - 0.5) * 15;
                    this.vy = -(Math.random() * 10 + 10);
                }
                else { 
                    this.x = -100;
                    this.y = Math.random() * height;
                    this.vx = Math.random() * 10 + 15;
                    this.vy = (Math.random() - 0.5) * 15;
                }
            }

            update() {
                if(!this.active) return;

                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.008; 

                if(this.x < -this.length - 200 || this.x > width + this.length + 200 || 
                   this.y < -this.length - 200 || this.y > height + this.length + 200 || 
                   this.alpha <= 0) {
                    this.active = false;
                }
            }

            draw() {
                if(!this.active) return;
                
                const tailX = this.x - this.vx * (this.length / 25); 
                const tailY = this.y - this.vy * (this.length / 25);

                const gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);

                ctx.beginPath();
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }
        
        for (let i = 0; i < 3; i++) {
            meteors.push(new Meteor());
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(0, 0, width, height);

            if (isWarping) {
                if (warpSpeed < 100) warpSpeed += 0.5;
            } else {
                if (warpSpeed > baseSpeed) warpSpeed *= 0.95;
            }

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (canSpawnMeteors && !isWarping) {
                if(Date.now() > nextMeteorTime) {
                    const m = meteors.find(meteor => !meteor.active);
                    if(m) {
                        m.spawn();
                        nextMeteorTime = Date.now() + 4000 + Math.random() * 1000;
                    }
                }
            }

            meteors.forEach(m => {
                m.update();
                m.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();


        /**
         * 2. BÖLÜM: SES EFEKTİ
         */
        function playWarpSound(durationSec) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 
                
                const actx = new AudioContext();
                actx.resume(); 
                
                const duration = durationSec;
                const bufferSize = actx.sampleRate * duration;
                const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
                const data = buffer.getChannelData(0);
                
                let lastOut = 0; 
                
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5; 
                }

                const noise = actx.createBufferSource();
                noise.buffer = buffer;

                const filter = actx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 100;

                const gainNode = actx.createGain();
                gainNode.gain.setValueAtTime(0, actx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.8, actx.currentTime + 2); 
                gainNode.gain.linearRampToValueAtTime(0.8, actx.currentTime + duration - 2); 
                gainNode.gain.linearRampToValueAtTime(0, actx.currentTime + duration); 

                filter.frequency.linearRampToValueAtTime(1000, actx.currentTime + 3); 
                filter.frequency.linearRampToValueAtTime(100, actx.currentTime + duration); 

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(actx.destination);
                
                noise.start();
            } catch (e) { console.error("Ses hatası:", e); }
        }


        /**
         * 3. BÖLÜM: GİRİŞ VE SAYAÇ
         */
        const TARGET_PASSWORD = "yıldızlarınkavuşması"; 
        const SECRET_MSG_CODES = [89, 246, 114, 252, 110, 103, 101, 108, 101, 114, 105, 109, 105, 122, 32, 107, 101, 115, 105, 351, 116, 105, 287, 105, 110, 100, 101, 44, 32, 98, 117, 32, 107, 105, 108, 105, 116, 32, 97, 231, 305, 108, 97, 99, 97, 107, 46, 46, 46];

        function decodeToString(codes) { return String.fromCharCode(...codes); }

        function attemptLogin() {
            const inputVal = document.getElementById("passwordInput").value.toLowerCase().trim();
            const errorMsg = document.getElementById("login-error");
            
            if (inputVal === TARGET_PASSWORD) {
                // --- BAŞARILI ---
                
                const loginScreen = document.getElementById("login-screen");
                loginScreen.style.opacity = "0";
                
                // Mobilde ses başlatmak için kullanıcı etkileşimi şarttır, burada buton click olduğu için çalışır.
                playWarpSound(12);

                isWarping = true;
                
                document.body.classList.add("shaking");

                setTimeout(() => {
                    const flash = document.getElementById("flash-overlay");
                    flash.style.opacity = "1"; 
                }, 11500);

                setTimeout(() => {
                    isWarping = false; 
                    document.body.classList.remove("shaking");
                    loginScreen.style.display = "none";
                    
                    // --- MÜZİK BAŞLATMA ---
                    const music = document.getElementById("finalMusic");
                    music.volume = 0.5; 
                    music.play().catch(e => console.log("Oynatma hatası (Mobilde etkileşim gerekebilir):", e));
                    
                    // --- METEORLARI AKTİF ET ---
                    canSpawnMeteors = true;
                    nextMeteorTime = Date.now() + 4000 + Math.random() * 1000;
                    // --------------------------

                    const mainCard = document.querySelector(".glass-card");
                    mainCard.style.display = "block";
                    
                    const flash = document.getElementById("flash-overlay");
                    flash.style.opacity = "0";

                    setTimeout(() => {
                        mainCard.style.opacity = "1";
                        mainCard.style.transform = "scale(1)";
                        mainCard.classList.add("active");
                    }, 500);

                }, 13000); 

            } else {
                // --- HATALI ---
                errorMsg.style.opacity = "1";
                const input = document.getElementById("passwordInput");
                input.style.borderColor = "#ff4d4d";
                input.style.transform = "translateX(10px)";
                setTimeout(() => input.style.transform = "translateX(-10px)", 100);
                setTimeout(() => input.style.transform = "translateX(0)", 200);
                setTimeout(() => {
                    errorMsg.style.opacity = "0";
                    input.style.borderColor = "rgba(255, 255, 255, 0.1)"; 
                }, 2000);
            }
        }

        document.getElementById("passwordInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") attemptLogin();
        });

        // --- ZAMANLAYICI AYARI ---
        const targetDate = new Date("2030-01-01T00:00:00").getTime(); 

        const timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const msgBox = document.getElementById("secret-message-box");

            if (distance < 0) {
                 clearInterval(timerInterval);
                 // Mobilde taşmaması için fontu küçülttük
                 document.querySelector(".timer-wrapper").innerHTML = "<div class='time-val' style='font-size:clamp(2rem, 5vw, 3rem)'>VUSLAT</div>";
                 msgBox.innerText = decodeToString(SECRET_MSG_CODES);
                 msgBox.style.filter = "blur(0)";
                 msgBox.style.color = "#fff";
                 msgBox.style.textShadow = "0 0 15px rgba(255,255,255,0.8)";
                 document.querySelector(".lock-icon").innerText = "🔓";
                 document.querySelector(".status-text").innerText = "ERİŞİM İZNİ VERİLDİ";
                 document.querySelector(".status-text").style.color = "#4ff";
                 return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d < 10 ? '0'+d : d;
            document.getElementById('hours').innerText = h < 10 ? '0'+h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0'+m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0'+s : s;
        }, 1000);

    </script>
</body>

</html>
