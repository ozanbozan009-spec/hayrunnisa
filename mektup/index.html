<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELİN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("MxfGSiLB-W35cceuR"); 
       })();
    </script>
    <style>
        :root {
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --galaxy-purple: #2a0a38;
            --galaxy-glow: rgba(147, 112, 219, 0.3);
            --deep-bg: #050508;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center bottom, #2b1029 0%, #150820 40%, #020105 100%);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            perspective: 1200px;
            touch-action: none; 
        }

        .nebula-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .nebula-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; animation: floatBlob 25s infinite alternate ease-in-out; }
        .blob-1 { width: 600px; height: 600px; background: #4b0082; top: -150px; left: -100px; } 
        .blob-2 { width: 500px; height: 500px; background: #8b0000; bottom: -100px; right: -50px; animation-delay: -5s; opacity: 0.25; } 
        .blob-3 { width: 400px; height: 400px; background: rgba(255, 215, 0, 0.1); top: 40%; left: 40%; animation-delay: -10s; } 
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 20px) scale(1.1); } }
        
        #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .scene {
            position: relative; z-index: 10; width: 100%; max-width: 550px;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d; pointer-events: none;
            padding: 20px;
        }

        .crystal-card {
            width: 100%; 
            min-height: 60vh;
            max-height: 85vh; 
            background: rgba(15, 10, 20, 0.75);
            border-radius: 16px;
            backdrop-filter: blur(25px) saturate(120%); -webkit-backdrop-filter: blur(25px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.5), 0 0 20px var(--galaxy-glow);
            position: relative; padding: 40px 30px;
            display: flex; flex-direction: column;
            transform-origin: center center;
            z-index: 20; pointer-events: auto;
            opacity: 1; transition: opacity 1.5s ease;
        }

        .corner-deco { position: absolute; width: 15px; height: 15px; border-color: rgba(255, 215, 0, 0.5); border-style: solid; pointer-events: none; transition: all 0.5s ease; }
        .tl { top: 15px; left: 15px; border-width: 1px 0 0 1px; }
        .tr { top: 15px; right: 15px; border-width: 1px 1px 0 0; }
        .bl { bottom: 15px; left: 15px; border-width: 0 0 1px 1px; }
        .br { bottom: 15px; right: 15px; border-width: 0 1px 1px 0; }

        .header { text-align: center; margin-bottom: 25px; pointer-events: none; }
        .title {
            font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 800;
            background: linear-gradient(to bottom, #fff8e1, #d4af37, #8a6e2f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(0,0,0,0.7); letter-spacing: 4px;
            line-height: 1.2;
        }
        .subtitle {
            display: block; font-size: 0.6rem; color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px; margin-top: 8px; text-transform: uppercase; opacity: 0.9;
            text-shadow: 0 0 10px rgba(147, 112, 219, 0.4);
        }

        @keyframes breathEffect {
            0%, 100% { transform: translateY(0); box-shadow: inset 0 5px 15px rgba(0,0,0,0.6); }
            50% { transform: translateY(-6px); box-shadow: inset 0 5px 25px rgba(0,0,0,0.4), 0 5px 15px rgba(255, 215, 0, 0.05); }
        }

        textarea {
            flex-grow: 1; 
            background: rgba(5, 5, 10, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; padding: 15px;
            color: #eee; font-family: 'Montserrat', sans-serif; 
            font-size: 16px; 
            line-height: 1.5; font-weight: 300;
            resize: none; outline: none; transition: all 0.4s ease;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.6);
            animation: breathEffect 4s ease-in-out infinite;
        }
        
        textarea:focus { 
            border-color: rgba(255, 215, 0, 0.3); 
            background: rgba(10, 10, 20, 0.6); 
            animation-play-state: paused; 
            transform: translateY(0); 
        }
        
        textarea::placeholder { color: rgba(255, 255, 255, 0.3); font-style: italic; }

        .magic-btn {
            margin-top: 20px; align-self: center;
            background: linear-gradient(135deg, #1a1020, #0a0510);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--gold); padding: 14px 40px; border-radius: 50px;
            font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 3px; font-weight: 700;
            cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 999; pointer-events: auto; user-select: none;
            min-width: 200px;
        }
        .magic-btn:hover, .magic-btn:active { 
            transform: translateY(-3px); 
            border-color: #fff; color: #fff;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3); 
        }

        .envelope-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 340px; height: 220px;
            z-index: 50; opacity: 0; display: none;
            pointer-events: none;
            transition: opacity 3s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .envelope-body {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #120a1f 0%, #050508 100%);
            box-shadow: 0 35px 80px rgba(0,0,0,0.95);
            position: relative; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden;
        }
        .envelope-body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 8px);
            opacity: 0.5; pointer-events: none;
        }
        .flap {
            position: absolute; top: 0; left: 0;
            border-left: 175px solid transparent; border-right: 175px solid transparent;
            border-top: 140px solid #1a1025; z-index: 2; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }
        .flap::after {
            content: ''; position: absolute; top: -142px; left: -175px; 
            border-left: 175px solid transparent; border-right: 175px solid transparent;
            border-top: 140px solid rgba(255, 215, 0, 0.03); pointer-events: none;
        }

        .royal-seal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(2.5);
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #dc143c, #8b0000, #500000);
            
            box-shadow: 0 5px 15px rgba(0,0,0,0.7), inset 0 0 15px rgba(0,0,0,0.3), 0 0 20px rgba(220, 20, 60, 0.4);
            
            z-index: 10; opacity: 0; display: flex; justify-content: center; align-items: center;
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.8rem; 
            
            color: #ffffff; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            
            border: 2px solid rgba(220, 20, 60, 0.5);
        }

        .crystal-card.shake { animation: errorShake 0.5s ease-in-out !important; }
        @keyframes errorShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .crystal-card.fly-up { animation: cardAscend 3.5s forwards cubic-bezier(0.4, 0, 0.2, 1) !important; pointer-events: none; }
        @keyframes cardAscend {
            0% { transform: rotateX(0) rotateY(0) translateY(0) scale(1); opacity: 1; }
            100% { transform: rotateX(20deg) rotateY(0) translateY(-150vh) scale(0.5); opacity: 0; }
        }
        
        .envelope-container.show { display: block; animation: fadeInEnv 3s forwards; }
        @keyframes fadeInEnv { from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

        .royal-seal.stamp-down { animation: stampSlam 1s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        @keyframes stampSlam { 0% { transform: translate(-50%, -50%) scale(4); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .envelope-container.sent { animation: ascend 10s ease-in-out forwards; }
        @keyframes ascend {
            0% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            40% { transform: translate(-50%, -150px) scale(0.95); filter: brightness(1.1); }
            100% { transform: translate(-50%, -400px) scale(0.5); opacity: 0; filter: brightness(1.5) blur(20px); }
        }

        .final-message {
            position: absolute; top: 55%; width: 100%; text-align: center;
            font-family: 'Cinzel'; font-size: 1rem; letter-spacing: 6px; color: var(--gold);
            opacity: 0; transition: opacity 3s; text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); pointer-events: none;
            padding: 0 20px; line-height: 1.5;
        }
        .final-message.visible { opacity: 1; }

        /* --- MOBİL VE TABLET UYUMLULUĞU --- */
        @media screen and (max-width: 768px) {
            .crystal-card { padding: 30px 20px; min-height: 50vh; }
            .title { font-size: 1.1rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.5rem; letter-spacing: 1px; }
            .magic-btn { padding: 12px 30px; font-size: 0.7rem; width: 100%; }
            .envelope-container { transform: translate(-50%, -50%) scale(0.6); }
            @keyframes fadeInEnv { from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(0.65); } }
            @keyframes ascend { 0% { transform: translate(-50%, -50%) scale(0.65); } 100% { transform: translate(-50%, -400px) scale(0.3); opacity: 0; } }
        }
        @media screen and (max-width: 380px) {
            .crystal-card { padding: 25px 15px; }
            .title { font-size: 1rem; }
            @keyframes fadeInEnv { from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); } to { opacity: 1; transform: translate(-50%, -50%) scale(0.55); } }
        }
    </style>
</head>
<body>

    <audio id="letterMusic" loop>
        <source src="mektup.mp3" type="audio/mpeg">
    </audio>

    <div class="nebula-container">
        <div class="nebula-blob blob-1"></div><div class="nebula-blob blob-2"></div><div class="nebula-blob blob-3"></div>
    </div>
    
    <canvas id="canvas-bg"></canvas>

    <div class="scene">
        <div class="crystal-card" id="mainCard">
            <div class="corner-deco tl"></div><div class="corner-deco tr"></div><div class="corner-deco bl"></div><div class="corner-deco br"></div>

            <div class="header">
                <div class="title">MESAFELERİN ÖTESİ</div>
                <span class="subtitle">O GÜN GELDİĞİNDE,<br>BU SATIRLARI GÖZLERİNE BAKARAK OKUYACAĞIM.</span>
            </div>
            
            <textarea id="letterText" placeholder="İçinden ne geliyorsa güzelim, O gün yan yana okumak için..."></textarea>
            
            <button class="magic-btn" onclick="sendToFuture()">RUHUMA GÖNDER</button>
        </div>

        <div class="envelope-container" id="envelope">
            <div class="envelope-body"><div class="flap"></div></div>
            <div class="royal-seal" id="seal">S</div>
        </div>
    </div>

    <div class="final-message" id="endText">MEKTUBUN YOLA ÇIKTI</div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('letterMusic');
            audio.volume = 0.5; 

            const playPromise = audio.play();

            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Otomatik oynatma tarayıcı tarafından durduruldu, etkileşim bekleniyor.");
                    
                    document.addEventListener('click', function playOnInteraction() {
                        audio.play();
                        document.removeEventListener('click', playOnInteraction);
                    }, { once: true }); 
                });
            }
        });

        const card = document.getElementById('mainCard');
        function handleTilt(e) {
            if(card.classList.contains('fly-up')) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }
        document.addEventListener('mousemove', handleTilt);
        document.addEventListener('mouseleave', () => {
            if(card.classList.contains('fly-up')) return;
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.size = Math.random() * 2; this.speedX = (Math.random() - 0.5) * 0.15; this.speedY = (Math.random() - 0.5) * 0.15; this.life = Math.random(); }
            update() { this.x += this.speedX; this.y += this.speedY; this.life += 0.005; if(this.x < -50 || this.x > width+50 || this.y < -50 || this.y > height+50) this.reset(); }
            draw() { const opacity = (Math.sin(this.life * 2) + 1) / 2 * 0.6; ctx.fillStyle = `rgba(255, 215, 0, ${opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<80; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0,width,height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
        animate();

        function sendToFuture() {
            const txt = document.getElementById('letterText');
            if(txt.value.trim() === "") {
                card.classList.add('shake');
                txt.style.borderColor = "#ff4d4d";
                txt.placeholder = "Lütfen önce bir şeyler yaz...";
                setTimeout(() => {
                    card.classList.remove('shake');
                    txt.style.borderColor = "rgba(255, 255, 255, 0.1)";
                }, 600);
                return;
            }

            const templateParams = {
                message: txt.value.trim(),
                name: "Selin", 
                email: "iletisim@fatmakity.baby", 
                title: "Kalpten Gelen Bir Mektup"
            };
            emailjs.send('service_ywdmz4m', 'template_rhpis0n', templateParams)
                .then(() => console.log('Mail gitti!'))
                .catch(err => console.error('Hata:', err));

            const env = document.getElementById('envelope');
            const seal = document.getElementById('seal');
            const msg = document.getElementById('endText');

            document.removeEventListener('mousemove', handleTilt);
            card.style.transform = 'translateY(0)'; 
            requestAnimationFrame(() => { card.classList.add('fly-up'); });

            setTimeout(() => { env.classList.add('show'); }, 2000);
            setTimeout(() => { seal.classList.add('stamp-down'); }, 5000);
            setTimeout(() => { env.classList.add('sent'); msg.classList.add('visible'); }, 7000);
            setTimeout(() => { resetSystem(); }, 14000);
        }

        function resetSystem() {
            const card = document.getElementById('mainCard');
            const env = document.getElementById('envelope');
            const seal = document.getElementById('seal');
            const msg = document.getElementById('endText');
            const txt = document.getElementById('letterText');

            msg.classList.remove('visible');
            card.classList.remove('fly-up');
            env.classList.remove('show', 'sent');
            seal.classList.remove('stamp-down');
            card.style.opacity = '0';
            card.style.transform = 'translateY(50px)';
            txt.value = "";
            txt.placeholder = "Doyamadıysan yazmaya biraz daha dök içini...";

            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) rotateX(0) rotateY(0)';
                setTimeout(() => { card.style.transform = ''; document.addEventListener('mousemove', handleTilt); }, 1000);
            }, 500);
        }
    </script>
</body>
</html>
